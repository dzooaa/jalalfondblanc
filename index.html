<style>
  :root {
    --orange:#ff6a2b;
    --orange-fonce:#d94a0a;
    --orange-pale:#fff0e8;
    --encre:#10141a;
    --gris:#5f6670;
    --trait:#e8e9ec;
    --fond:#f3f4f6;
    --blanc:#ffffff;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { -webkit-text-size-adjust:100%; }
  body {
    min-height:100vh; background:var(--fond); color:var(--encre);
    font-family:"Space Grotesk","Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    display:flex; justify-content:center;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .page { width:100%; max-width:460px; min-height:100vh; background:var(--blanc); display:flex; flex-direction:column; padding:28px 24px 24px; }

  .haut { display:flex; align-items:center; justify-content:space-between; color:var(--orange); }
  .haut span { font-size:.9rem; color:var(--gris); }

  .marque { margin-top:56px; }
  .marque h1 { font-size:4.6rem; font-weight:600; line-height:.95; letter-spacing:-.03em; }
  .marque h1 em { display:block; font-style:normal; color:var(--orange); }
  .marque p { margin-top:18px; font-size:1.02rem; color:var(--gris); }

  .actions { margin-top:36px; }
  .principal {
    display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
    margin-top:16px; padding:17px 20px; border-radius:14px; text-decoration:none;
    background:var(--orange-fonce); color:var(--blanc); font:inherit; font-size:1.05rem; font-weight:600;
  }
  .principal:active { background:#b83e07; }

  .liste { margin-top:0; border:1px solid var(--trait); border-radius:16px; overflow:hidden; }
  .ligne { display:flex; align-items:center; gap:16px; padding:15px 18px; text-decoration:none; color:inherit; background:var(--blanc); }
  .ligne + .ligne { border-top:1px solid var(--trait); }
  .ligne:active { background:var(--fond); }
  .pastille { flex:none; width:42px; height:42px; border-radius:50%; display:grid; place-items:center; background:var(--orange-pale); color:var(--orange-fonce); }
  .texte { flex:1; min-width:0; }
  .texte small { display:block; font-size:.82rem; color:var(--gris); margin-bottom:2px; }
  .texte strong { display:block; font-size:1.08rem; font-weight:600; letter-spacing:.01em; }
  svg { display:block; }
  .chev { flex:none; color:#b5b9c2; }

  .credit { margin-top:6px; }
  .credit a { color:var(--orange-fonce); text-decoration:none; font-weight:600; }
  footer { margin-top:auto; padding-top:28px; text-align:center; font-size:.82rem; color:var(--gris); }

  a:focus-visible { outline:3px solid var(--orange); outline-offset:2px; }
  @media (min-width:520px) {
    body { padding:32px 0; }
    .page { min-height:0; border-radius:24px; box-shadow:0 18px 50px rgba(16,20,26,.12); }
  }
</style>
</head>
